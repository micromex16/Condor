<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Condor — Sign In</title>

  <!-- Supabase (same as index.html) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="condor-supabase.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #1C3B2A;
      --cream:   #F4F1E6;
      --gold:    #C6A46A;
      --red:     #8B2020;
    }

    body {
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green);
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Dot-grid texture */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(198,164,106,0.10) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
    }

    /* Radial warm glow */
    body::after {
      content: '';
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(198,164,106,0.11) 0%, transparent 68%);
      pointer-events: none;
    }

    /* ── Animations ──────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes goldPulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.9;  }
    }

    /* ── Content column ─────────────────────────────────── */
    .login-inner {
      position: relative;
      z-index: 1;
      max-width: 360px;
      width: 100%;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ── Logo mark ──────────────────────────────────────── */
    .login-mark {
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .login-mark img {
      height: 140px;
      width: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 10px 36px rgba(0,0,0,0.38));
    }

    .tagline {
      font-size: 8.5px;
      font-weight: 300;
      letter-spacing: 0.34em;
      color: var(--gold);
      text-transform: uppercase;
      line-height: 2;
      margin-top: 10px;
    }

    /* ── Gold rule ──────────────────────────────────────── */
    .gold-rule {
      width: 44px;
      height: 1px;
      background: var(--gold);
      margin: 32px auto;
      animation: goldPulse 3s ease-in-out infinite;
    }

    /* ── Form content ───────────────────────────────────── */
    .login-content {
      opacity: 0;
      animation: fadeUp 0.5s ease 0.2s forwards;
      width: 100%;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      color: var(--cream);
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 9.5px;
      font-weight: 300;
      letter-spacing: 0.28em;
      color: rgba(244,241,230,0.45);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .form-rule {
      width: 36px;
      height: 1.5px;
      background: var(--gold);
      opacity: 0.7;
      margin: 0 auto 26px;
    }

    /* ── Google button (outlined) ────────────────────────── */
    .btn-google {
      width: 100%;
      max-width: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      background: transparent;
      color: var(--cream);
      border: 1px solid var(--cream);
      border-radius: 0;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-google:hover {
      background: var(--cream);
      color: var(--green);
    }
    .btn-google:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Message banner ──────────────────────────────────── */
    .msg {
      padding: 10px 14px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.03em;
      margin-bottom: 18px;
      border-left: 2px solid;
      display: none;
    }
    .msg.error   { background: rgba(139,32,32,0.15); border-color: var(--red); color: #e08080; display: block; }

    @media (max-width: 720px) {
      h1 { font-size: 26px; }
      .login-mark img { height: 120px; }
    }
  </style>
</head>

<body>

  <div class="login-inner">
    <div class="login-mark">
      <img src="condor-logo.png" alt="Condor Golf" />
      <p class="tagline">Track the Game<br>Within the Game</p>
    </div>

    <div class="gold-rule"></div>

    <div class="login-content">
      <h1>Welcome Back</h1>
      <p class="sub">Sign in to your account</p>
      <div class="form-rule"></div>

      <div class="msg" id="msg"></div>

      <button class="btn-google" id="btn-google-signin" onclick="handleGoogle()">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.657 14.013 17.64 11.705 17.64 9.2z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.909-2.259c-.805.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
    </div>
  </div>

  <script>
    // ── Helpers ───────────────────────────────────────────────────────────
    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    // ── Check session on load — if already logged in, go straight to app ─
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'index.html';
    });

    // ── Google OAuth ──────────────────────────────────────────────────────
    async function handleGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) showMsg(error.message, 'error');
    }
  </script>

</body>
</html>
