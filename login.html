<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Condor — Sign In</title>

  <!-- Supabase (same as index.html) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="condor-supabase.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #1C3B2A;
      --green2:  #234B37;
      --cream:   #F4F1E6;
      --mist:    #E8E4D8;
      --gold:    #C6A46A;
      --saddle:  #7A5A3A;
      --black:   #1A1A1A;
      --red:     #8B2020;
    }

    body {
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      display: flex;
      background: var(--green);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animations ──────────────────────────────────────── */
    @keyframes panelSlide {
      from { transform: translateX(-28px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes goldPulse {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.9;  }
    }

    /* ── Left panel ──────────────────────────────────────── */
    .left {
      width: 44%;
      min-height: 100vh;
      background: var(--green);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      animation: panelSlide 0.85s cubic-bezier(.22,.68,0,1.1) both;
    }

    /* Dot-grid texture */
    .left::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(198,164,106,0.10) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
    }

    /* Radial warm glow behind logo */
    .left::after {
      content: '';
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(198,164,106,0.11) 0%, transparent 68%);
      pointer-events: none;
    }

    .left-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 40px;
      animation: fadeIn 1s 0.2s both;
    }

    .logo {
      width: 210px;
      height: auto;
      filter: drop-shadow(0 10px 36px rgba(0,0,0,0.38));
    }

    .gold-rule {
      width: 44px;
      height: 1px;
      background: var(--gold);
      margin: 16px auto 12px;
      animation: goldPulse 3s ease-in-out infinite;
    }

    .tagline {
      font-size: 8.5px;
      font-weight: 300;
      letter-spacing: 0.34em;
      color: var(--gold);
      text-transform: uppercase;
      line-height: 2;
    }

    /* ── Gold vertical rule ──────────────────────────────── */
    .vr {
      width: 1px;
      min-height: 100vh;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        var(--gold) 12%,
        var(--gold) 88%,
        transparent 100%
      );
      opacity: 0.42;
      flex-shrink: 0;
    }

    /* ── Right panel ─────────────────────────────────────── */
    .right {
      flex: 1;
      min-height: 100vh;
      background: var(--mist);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 52px;
      position: relative;
      animation: fadeIn 0.9s 0.1s both;
    }

    /* Subtle line texture */
    .right::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(122,90,58,0.028) 0px,
        rgba(122,90,58,0.028) 1px,
        transparent 1px,
        transparent 9px
      );
      pointer-events: none;
    }

    .form-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      animation: fadeUp 0.7s 0.25s both;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      color: var(--green);
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 9.5px;
      font-weight: 300;
      letter-spacing: 0.28em;
      color: var(--saddle);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .form-rule {
      width: 36px;
      height: 1.5px;
      background: var(--gold);
      opacity: 0.7;
      margin-bottom: 26px;
    }

    /* ── Fields ──────────────────────────────────────────── */
    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--saddle);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(28,59,42,0.16);
      border-radius: 2px;
      font-family: 'Jost', sans-serif;
      font-size: 13.5px;
      font-weight: 300;
      color: var(--black);
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }

    .field input:focus {
      border-color: var(--green);
      background: rgba(255,255,255,0.96);
      box-shadow: 0 0 0 3px rgba(28,59,42,0.07);
    }

    .field input::placeholder {
      color: rgba(122,90,58,0.35);
      font-weight: 300;
    }

    /* ── Forgot password ─────────────────────────────────── */
    .forgot {
      display: block;
      text-align: right;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--saddle);
      opacity: 0.7;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Jost', sans-serif;
      margin-bottom: 22px;
      transition: opacity 0.15s;
    }
    .forgot:hover { opacity: 1; text-decoration: underline; }

    /* ── Primary button ──────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: var(--cream);
      border: none;
      border-radius: 2px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--gold);
      opacity: 0.6;
    }
    .btn-primary:hover { background: var(--green2); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* ── Divider ─────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 20px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--gold);
      opacity: 0.22;
    }
    .divider span {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--saddle);
      text-transform: uppercase;
      opacity: 0.6;
    }

    /* ── Google button ───────────────────────────────────── */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      background: var(--black);
      color: var(--cream);
      border: none;
      border-radius: 2px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-google:hover { background: #2a2a2a; transform: translateY(-1px); }
    .btn-google:active { transform: translateY(0); }
    .btn-google:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* ── Toggle sign-up/sign-in ──────────────────────────── */
    .toggle {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(122,90,58,0.15);
      text-align: center;
      font-size: 11px;
      font-weight: 300;
      color: var(--saddle);
      letter-spacing: 0.06em;
    }
    .toggle button {
      background: none;
      border: none;
      color: var(--green);
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s;
    }
    .toggle button:hover { color: var(--gold); }

    /* ── Message banner ──────────────────────────────────── */
    .msg {
      padding: 10px 14px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.03em;
      margin-bottom: 18px;
      border-left: 2px solid;
      display: none;
    }
    .msg.error   { background: rgba(139,32,32,0.07);  border-color: var(--red);   color: var(--red);   display: block; }
    .msg.success { background: rgba(28,59,42,0.07);   border-color: var(--green); color: var(--green); display: block; }

    /* ── Back button (forgot password) ───────────────────── */
    .back-btn {
      background: none;
      border: none;
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--saddle);
      cursor: pointer;
      margin-bottom: 22px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .back-btn:hover { opacity: 1; }

    /* ── Panels (mode switching) ─────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 720px) {
      body { flex-direction: column; }
      .left { width: 100%; min-height: auto; padding: 44px 24px 30px; }
      .logo { width: 150px; }
      .vr   { display: none; }
      .right { min-height: auto; padding: 36px 28px 56px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>

<body>

  <!-- ── Left panel ──────────────────────────────────────────────────── -->
  <div class="left">
    <div class="left-inner">
      <!--
        Place your logo file in the same folder as this HTML.
        Name it: condor-logo.png  (use the version with transparent background)
      -->
      <img src="condor-logo.png" alt="Condor Golf" class="logo" />
      <div class="gold-rule"></div>
      <p class="tagline">Track the Game<br>Within the Game</p>
    </div>
  </div>

  <!-- ── Gold vertical rule ──────────────────────────────────────────── -->
  <div class="vr" aria-hidden="true"></div>

  <!-- ── Right panel ─────────────────────────────────────────────────── -->
  <div class="right">
    <div class="form-inner">

      <!-- Message banner (shared across all panels) -->
      <div class="msg" id="msg"></div>

      <!-- ── SIGN IN panel ──────────────────────────────── -->
      <div class="panel active" id="panel-signin">
        <h1>Welcome Back</h1>
        <p class="sub">Sign in to your account</p>
        <div class="form-rule"></div>

        <div class="field">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button class="forgot" onclick="showPanel('forgot')">Forgot password?</button>

        <button class="btn-primary" id="btn-signin" onclick="handleSignIn()">Sign In</button>

        <div class="divider">
          <div class="divider-line"></div>
          <span>or</span>
          <div class="divider-line"></div>
        </div>

        <button class="btn-google" id="btn-google-signin" onclick="handleGoogle()">
          <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.657 14.013 17.64 11.705 17.64 9.2z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.909-2.259c-.805.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="toggle">
          First time on the course?
          <button onclick="showPanel('signup')">Join the Society</button>
        </div>
      </div>

      <!-- ── SIGN UP panel ──────────────────────────────── -->
      <div class="panel" id="panel-signup">
        <h1>Join the Society</h1>
        <p class="sub">Create your Condor account</p>
        <div class="form-rule"></div>

        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Choose a strong password" autocomplete="new-password" />
        </div>

        <div class="field">
          <label for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="Repeat password" autocomplete="new-password" />
        </div>

        <button class="btn-primary" id="btn-signup" onclick="handleSignUp()" style="margin-bottom:0">
          Create Account
        </button>

        <div class="divider">
          <div class="divider-line"></div>
          <span>or</span>
          <div class="divider-line"></div>
        </div>

        <button class="btn-google" id="btn-google-signup" onclick="handleGoogle()">
          <svg width="17" height="17" viewBox="0 0 18 18" fill="none">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.657 14.013 17.64 11.705 17.64 9.2z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.909-2.259c-.805.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <div class="toggle">
          Already a member?
          <button onclick="showPanel('signin')">Sign in</button>
        </div>
      </div>

      <!-- ── FORGOT PASSWORD panel ──────────────────────── -->
      <div class="panel" id="panel-forgot">
        <button class="back-btn" onclick="showPanel('signin')">← Back to sign in</button>
        <h1>Reset Password</h1>
        <p class="sub">We'll send a link to your inbox</p>
        <div class="form-rule"></div>

        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <button class="btn-primary" id="btn-forgot" onclick="handleForgot()">
          Send Reset Link
        </button>
      </div>

    </div><!-- /form-inner -->
  </div><!-- /right -->

  <script>
    // ── Helpers ───────────────────────────────────────────────────────────
    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }
    function clearMsg() {
      const el = document.getElementById('msg');
      el.textContent = '';
      el.className = 'msg';
    }
    function setLoading(btnId, loading, defaultText) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : defaultText;
    }
    function showPanel(name) {
      clearMsg();
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
    }

    // ── Check session on load — if already logged in, go straight to app ─
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'index.html';
    });

    // ── Google OAuth ──────────────────────────────────────────────────────
    async function handleGoogle() {
      clearMsg();
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) showMsg(error.message, 'error');
    }

    // ── Email sign-in ─────────────────────────────────────────────────────
    async function handleSignIn() {
      clearMsg();
      const email    = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;
      if (!email || !password) { showMsg('Please fill in both fields.', 'error'); return; }

      setLoading('btn-signin', true, 'Sign In');
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      setLoading('btn-signin', false, 'Sign In');

      if (error) {
        showMsg(error.message, 'error');
      } else {
        window.location.href = '/';
      }
    }

    // ── Email sign-up ─────────────────────────────────────────────────────
    async function handleSignUp() {
      clearMsg();
      const email    = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm  = document.getElementById('signup-confirm').value;

      if (!email || !password) { showMsg('Please fill in all fields.', 'error'); return; }
      if (password !== confirm) { showMsg('Passwords do not match.', 'error'); return; }
      if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }

      setLoading('btn-signup', true, 'Create Account');
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: window.location.origin }
      });
      setLoading('btn-signup', false, 'Create Account');

      if (error) {
        showMsg(error.message, 'error');
      } else if (data.user && !data.session) {
        showMsg('Account created! Check your email to confirm before signing in.', 'success');
      } else {
        window.location.href = '/';
      }
    }

    // ── Forgot password ───────────────────────────────────────────────────
    async function handleForgot() {
      clearMsg();
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) { showMsg('Please enter your email address.', 'error'); return; }

      setLoading('btn-forgot', true, 'Send Reset Link');
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });
      setLoading('btn-forgot', false, 'Send Reset Link');

      if (error) {
        showMsg(error.message, 'error');
      } else {
        showMsg('Reset link sent — check your inbox.', 'success');
      }
    }

    // ── Allow Enter key to submit ─────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const active = document.querySelector('.panel.active').id;
      if (active === 'panel-signin')  handleSignIn();
      if (active === 'panel-signup')  handleSignUp();
      if (active === 'panel-forgot')  handleForgot();
    });
  </script>

</body>
</html>
